name: Sync and publish

on:
  # Sent by the Power Automate flow with the latest SharePoint events.
  repository_dispatch:
    types: [sharepoint-sync]
  # Rebuild after code or data changes, daily as a safety net, or by hand.
  push:
    branches: [main]
  schedule:
    # Hourly, so edits in the USG / college Google calendars come through quickly.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge SharePoint export
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
          python scripts/sync.py "$RUNNER_TEMP/payload.json"

      - name: Save synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/build.py
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Sync events"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Build feeds and page
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
